<!DOCTYPE html>
<html>
  <head>
    <title>Contact Form</title>
  </head>
  <body>
    <!-- Hidden form for Netlify Forms detection at build time -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="role" />
      <select name="project-stage">
        <option value="Service agent pilot">Service agent pilot</option>
        <option value="AI governance / compliance readiness">AI governance / compliance readiness</option>
        <option value="Virtual Employees">Virtual Employees</option>
        <option value="AI literacy &amp; training">AI literacy &amp; training</option>
        <option value="Something else">Something else</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
