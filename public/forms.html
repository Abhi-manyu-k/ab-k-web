<!DOCTYPE html>
<html>
  <head>
    <title>Contact Form</title>
  </head>
  <body>
    <!-- Hidden form for Netlify Forms detection at build time -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organisation" />
      <select name="topic">
        <option value="Speaking invitation">Speaking invitation</option>
        <option value="Research collaboration">Research collaboration</option>
        <option value="Question about the framework or writing">Question about the framework or writing</option>
        <option value="Something else">Something else</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
